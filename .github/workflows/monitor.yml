name: Douglas price monitor

on:
  schedule:
    # 04:00, 10:00 і 16:00 UTC = 07:00, 13:00 і 19:00 за Києвом (літній час)
    - cron: "0 4,10,16 * * *"
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Надіслати статус у Telegram навіть якщо змін немає"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: douglas-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_PRICE: ${{ vars.TARGET_PRICE }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          FORCE_NOTIFY: ${{ inputs.force_notify }}
        run: python monitor.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state.json
          if git diff --cached --quiet; then
            echo "Стан не змінився."
          else
            git commit -m "state: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash || true
            git push
          fi
